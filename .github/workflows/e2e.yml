name: e2e

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  e2e:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WireGuard
        run: |
          sudo apt update
          sudo apt install -y wireguard

      - name: Setup WireGuard configuration
        run: |
          mkdir -p $HOME/wireguard
          echo "[Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = 10.0.0.3/24
          Table = off

          [Peer]
          PublicKey = ${{ secrets.WG_PUBLIC_KEY_SERVER }}
          Endpoint = ${{ vars.VPN_ENDPOINT }}
          AllowedIPs = 194.87.118.78/32
          PersistentKeepalive = 25" > $HOME/wireguard/wg0.conf

      - name: Start WireGuard VPN
        run: |
          sudo wg-quick up $HOME/wireguard/wg0.conf

      - name: Add custom routes
        run: |
          sudo ip route add 194.87.118.78 via 10.0.0.1 dev wg0

      - name: Check network access
        run: |
          ping -c 3 github.com
          curl https://api.github.com

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm run start
          browser: chrome
          wait-on: ${{ vars.SERVER_SIDE_URL }}
        env:
          SERVER_SIDE_URL: ${{ vars.SERVER_SIDE_URL }}
          BACKAPI_URL: ${{ vars.BACKAPI_URL }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
