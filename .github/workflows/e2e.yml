name: e2e

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  e2e:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WireGuard
        run: sudo apt update && sudo apt install -y wireguard iproute2

      - name: Сохранить приватный ключ WireGuard
        run: echo "${{ secrets.WG_PRIVATE_KEY }}" > privatekey

      - name: Настройка интерфейса WireGuard
        run: |
          sudo ip link add dev wg0 type wireguard
          sudo ip address add dev wg0 10.0.0.3 peer 10.0.0.1
          sudo wg set wg0 listen-port 48123 \
            private-key privatekey \
            peer ${{ secrets.WG_PUBLIC_KEY_SERVER }} \
            allowed-ips 10.0.0.1/32,194.87.118.78/32 \
            endpoint ${{ vars.VPN_ENDPOINT }} \
            persistent-keepalive 25
          sudo ip link set up dev wg0

      - name: Добавить маршрут и правило для трафика к 194.87.118.78 через VPN
        run: |
          TARGET_IP=194.87.118.78
          VPN_IFACE=wg0
          VPN_TABLE=100

          # Получить IP VPN интерфейса
          VPN_LOCAL_IP=$(ip -4 addr show $VPN_IFACE | grep -oP '(?<=inet\s)\d+(\.\d+){3}' | head -n1)

          # Добавить кастомную таблицу маршрутизации
          echo "$VPN_TABLE vpn" | sudo tee -a /etc/iproute2/rt_tables

          # Добавить маршрут до IP через wg0
          sudo ip route add $TARGET_IP/32 dev $VPN_IFACE table vpn

          # Добавить правило, чтобы трафик к IP шел через таблицу vpn
          sudo ip rule add to $TARGET_IP/32 table vpn

          # Проверка маршрута
          ip route get $TARGET_IP

      - name: Проверка подключения через VPN
        run: |
          curl -v --connect-timeout 10 https://backapi.onetimelink.ru/metrics || exit 1

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm run start
          browser: chrome
          wait-on: ${{ vars.SERVER_SIDE_URL }}
        env:
          SERVER_SIDE_URL: ${{ vars.SERVER_SIDE_URL }}
          BACKAPI_URL: ${{ vars.BACKAPI_URL }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: 🧹 Очистка маршрутов и VPN
        if: always()
        run: |
          TARGET_IP=194.87.118.78
          VPN_TABLE=100

          sudo ip rule del to $TARGET_IP/32 table vpn || true
          sudo ip route flush table vpn || true
          sudo sed -i '/100 vpn/d' /etc/iproute2/rt_tables || true
          sudo ip link del wg0 || true
          shred -u privatekey || true
