name: e2e

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm start
        env:
          SERVER_SIDE_URL: ${{ env.SERVER_SIDE_URL }}
          BACKAPI_URL: ${{ env.BACKAPI_URL }}
