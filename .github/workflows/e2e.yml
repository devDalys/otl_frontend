name: e2e

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  e2e:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WireGuard
        run: sudo apt update && sudo apt install -y wireguard

      - name: Save WireGuard private key
        run: echo "${{ secrets.WG_PRIVATE_KEY }}" > privatekey

      - name: Setup WireGuard interface
        run: |
          sudo ip link add dev wg0 type wireguard
          sudo ip address add 10.0.0.2/32 dev wg0
          sudo wg set wg0 listen-port 48123 \
            private-key privatekey \
            peer ${{ secrets.WG_PUBLIC_KEY_SERVER }} \
            allowed-ips 194.87.118.78/32 \
            endpoint ${{ vars.VPN_ENDPOINT }}
          sudo ip link set up dev wg0

      - name: Add route to VPN target
        run: sudo ip route add 194.87.118.78 via 10.0.0.1 dev wg0

      - name: Check routing table (debug)
        run: ip route

      - name: Check network access
        run: |
          ping -c 3 github.com || true
          curl https://api.github.com

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm run start
          browser: chrome
          wait-on: ${{ vars.SERVER_SIDE_URL }}
        env:
          SERVER_SIDE_URL: ${{ vars.SERVER_SIDE_URL }}
          BACKAPI_URL: ${{ vars.BACKAPI_URL }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
